<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>{{ isEditMode ? 'Sửa thông tin khách hàng' : 'Thêm khách hàng mới' }}</h2>

      <!-- Loading -->
      <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Đang tải...</span>
        </div>
      </div>

      <!-- Form -->
      <form *ngIf="!loading" [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="mt-4">
        <div class="mb-3">
          <label for="name" class="form-label">Họ và tên <span class="text-danger">*</span></label>
          <input
            type="text"
            id="name"
            class="form-control"
            formControlName="name"
            [class.is-invalid]="f['name'].invalid && f['name'].touched">
          <div class="invalid-feedback" *ngIf="f['name'].invalid && f['name'].touched">
            Họ tên là bắt buộc, tối đa 150 ký tự
          </div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
          <input
            type="text"
            id="phone"
            class="form-control"
            formControlName="phone"
            [class.is-invalid]="f['phone'].invalid && f['phone'].touched">
          <div class="invalid-feedback" *ngIf="f['phone'].invalid && f['phone'].touched">
            Số điện thoại là bắt buộc, tối đa 20 ký tự
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="f['email'].invalid && f['email'].touched">
          <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
            Email không hợp lệ
          </div>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Địa chỉ</label>
          <textarea
            id="address"
            class="form-control"
            rows="3"
            formControlName="address"></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="submitting">
            {{ submitting ? 'Đang lưu...' : (isEditMode ? 'Lưu thay đổi' : 'Tạo mới') }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="submitting">
            Hủy
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
