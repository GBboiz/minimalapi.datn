<main class="auth-card card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h3 mb-2">Đăng nhập</h1>
    <p class="text-muted mb-3">Hệ thống Quản lý Bán hàng & Tồn kho</p>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
      {{ errorMessage }}
    </div>

    <!-- Quick Demo / Admin Account Buttons -->
    <div class="border rounded p-3 mb-3 bg-light">
      <div class="fw-semibold small text-dark mb-2">Tài khoản thử nghiệm:</div>
      
      <!-- SuperAdmin -->
      <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
        <div>
          <div class="small fw-bold text-primary">Quản trị viên Hệ thống (Admin)</div>
          <div class="text-muted" style="font-size: 0.78rem;">superadmin / 12345678</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="fillSuperAdmin()">
          Điền Admin
        </button>
      </div>

      <!-- Demo Store -->
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="small fw-bold text-secondary">Cửa hàng Bán hàng (Shop)</div>
          <div class="text-muted" style="font-size: 0.78rem;">demo&#64;minimalapi.local / Demo&#64;123456</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillDemo()">
          Điền Shop
        </button>
      </div>
    </div>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label small">Tài khoản hoặc Email</label>
        <input class="form-control" type="text" name="email" [(ngModel)]="email" placeholder="superadmin hoặc email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small">Mật khẩu</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
        {{ loading ? 'Đang xử lý...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="mt-3 mb-0 text-center small text-muted">
      Chưa có tài khoản? <a routerLink="/register">Tạo cửa hàng mới</a>
    </p>
  </div>
</main>
