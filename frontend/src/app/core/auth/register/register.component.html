<main class="auth-card card shadow-sm"><div class="card-body p-4"><h1 class="h3">Tạo cửa hàng</h1><form (ngSubmit)="submit()"><input class="form-control mb-3" name="fullName" [(ngModel)]="fullName" placeholder="Họ và tên" required><input class="form-control mb-3" type="email" name="email" [(ngModel)]="email" placeholder="Email" required><input class="form-control mb-3" name="storeName" [(ngModel)]="storeName" placeholder="Tên cửa hàng" required><input class="form-control mb-3" type="password" name="password" [(ngModel)]="password" minlength="8" placeholder="Mật khẩu (ít nhất 8 ký tự)" required><button class="btn btn-primary w-100" [disabled]="loading">{{ loading ? 'Đang tạo...' : 'Tạo cửa hàng' }}</button></form><p class="mt-3 mb-0">Đã có tài khoản? <a routerLink="/login">Đăng nhập</a></p></div></main>
